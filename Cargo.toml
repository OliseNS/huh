[package]
name = "huh"
version = "0.1.1"
edition = "2024"

[dependencies]
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "0.13", default-features = false }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
opt-level = "s"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
